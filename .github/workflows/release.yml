# Push a tag such as v0.1.0 to build the macOS app and attach its .dmg to a GitHub release.
# The app is signed ad hoc unless the CODESIGN_IDENTITY / NOTARY_PROFILE setup in build.ts is
# added here (a certificate imported into the runner's keychain, and a notarytool profile).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "gitbox $GITHUB_REF_NAME" --generate-notes
