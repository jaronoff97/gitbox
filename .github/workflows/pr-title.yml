# A pull request's title must be a Conventional Commit (https://www.conventionalcommits.org), such
# as `feat(chat): let the agent act on the board` or `fix: keep empty arguments on Bun`. PRs are
# squash-merged with their title as the commit's message, and release-please (release.yml) reads
# those commits for the version and the changelog. The subject starts in lower case.
name: pr-title

on:
  # The base branch's workflow, which reads the title only; it never checks out the PR's code.
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in the title "{title}" starts with an upper-case letter.
            Start it in lower case, as in "feat(chat): let the agent act on the board".
