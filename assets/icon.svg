<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
	<!-- gitbox: four lanes of cards dropping into an inbox tray. macOS grid: an 824 px body in a 1024 canvas. -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2b2c40" />
			<stop offset="1" stop-color="#11111b" />
		</linearGradient>
		<linearGradient id="tray" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#89b4fa" />
			<stop offset="1" stop-color="#74c7ec" />
		</linearGradient>
		<clipPath id="body">
			<rect x="100" y="100" width="824" height="824" rx="185" />
		</clipPath>
	</defs>

	<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" />
	<g clip-path="url(#body)">
		<!-- lanes -->
		<g fill="#ffffff" fill-opacity="0.06">
			<rect x="227" y="232" width="120" height="520" rx="28" />
			<rect x="377" y="232" width="120" height="520" rx="28" />
			<rect x="527" y="232" width="120" height="520" rx="28" />
			<rect x="677" y="232" width="120" height="520" rx="28" />
		</g>
		<!-- cards: todo, requested, waiting on me, merged / closed -->
		<g fill="#9399b2">
			<rect x="243" y="250" width="88" height="84" rx="16" />
			<rect x="243" y="348" width="88" height="64" rx="16" />
		</g>
		<g fill="#f9e2af">
			<rect x="393" y="250" width="88" height="104" rx="16" />
			<rect x="393" y="368" width="88" height="84" rx="16" />
			<rect x="393" y="466" width="88" height="70" rx="16" />
		</g>
		<g fill="#89b4fa">
			<rect x="543" y="250" width="88" height="76" rx="16" />
		</g>
		<g fill="#cba6f7">
			<rect x="693" y="250" width="88" height="96" rx="16" />
			<rect x="693" y="360" width="88" height="76" rx="16" />
			<rect x="693" y="450" width="88" height="96" rx="16" />
		</g>
		<!-- the tray, in front of the lanes -->
		<path
			d="M196 606 H372 Q390 606 396 623 L414 676 Q421 694 440 694 H584 Q603 694 610 676 L628 623 Q634 606 652 606 H828 V784 Q828 828 784 828 H240 Q196 828 196 784 Z"
			fill="url(#tray)"
		/>
		<path d="M196 606 H372 Q390 606 396 623 L414 676 Q421 694 440 694 H584 Q603 694 610 676 L628 623 Q634 606 652 606 H828" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" />
	</g>
	<rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" />
</svg>
